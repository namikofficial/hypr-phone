[package]
name = "hypr-phone"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Hyprland-native Android presence layer — auto-discovery, special-workspace toggle, scrcpy profiles, KDE Connect bridge"

[[bin]]
name = "hypr-phone"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
which = "6"

[dev-dependencies]
tempfile = "3"
